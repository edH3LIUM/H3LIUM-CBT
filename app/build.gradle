plugins {
    id 'com.android.application'
}

android {
    namespace 'com.h3lium.cbt'
    compileSdk 33

    defaultConfig {
        applicationId "com.h3lium.cbt"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
