plugins {
    id 'com.android.application'
}

android {
    namespace 'com.h3lium.cbt'
    compileSdk 34

    defaultConfig {
        applicationId "com.h3lium.cbt"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

// Copy uploaded logo.png to drawable folder
task copyIcon {
    doFirst {
        def resDir = file("src/main/res/drawable")
        if (!resDir.exists()) resDir.mkdirs()
        
        def sourceFile = file("../logo.png")
        if (sourceFile.exists()) {
            copy {
                from sourceFile
                into resDir
                rename { 'ic_launcher.png' }
            }
        }
    }
}

preBuild.dependsOn copyIcon
