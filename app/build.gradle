plugins {
    id 'com.android.application'
}

android {
    namespace 'com.h3lium.cbt'
    compileSdk 33

    defaultConfig {
        applicationId "com.h3lium.cbt"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

// Auto-create drawable folder & launcher icon
task createIcon {
    doFirst {
        def resDir = file("src/main/res/drawable")
        if (!resDir.exists()) resDir.mkdirs()
        
        def iconFile = file("src/main/res/drawable/ic_launcher.xml")
        iconFile.text = '''<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path
        android:fillColor="#00BCD4"
        android:pathData="M0,0h108v108h-108z"/>
    <path
        android:fillColor="#FFFFFF"
        android:pathData="M30,30h12v48h-12zM66,30h12v48h-12zM42,51h24v10h-24z"/>
</vector>'''
    }
}

preBuild.dependsOn createIcon
